# ==============================================================================
# PictoHabla Backend — TrueNAS SCALE 25.10.7 Production Compose
# ==============================================================================
# Despliegue en TrueNAS SCALE:
#   Ruta: Apps -> Discover Apps -> Custom App -> Install via YAML
# Características:
#   - Sin puertos publicados en el host del NAS (acceso 100% aislado).
#   - Integración directa con Cloudflare Tunnel existente mediante la red
#     Docker compartida 'ix-cloudflared_default' (Subred: 172.16.1.0/24).
#   - Red 'pictohabla-internal' estrictamente aislada (internal: true) para
#     comunicación exclusiva entre Spring Boot y PostgreSQL.
#   - PostgreSQL 16 Alpine NO está en la red de Cloudflare ni expone el puerto 5432.
#   - Alias DNS 'pictohabla-backend' configurado para resolución interna en Cloudflare.
#   - Montajes persistentes en datasets ZFS:
#       * /mnt/Datos/PictoHabla/Postgres (UID 70:70, recordsize=16k)
#       * /mnt/Datos/PictoHabla/Uploads  (UID 1000:1000, recordsize=128k)
#   - Límites de memoria y CPU estrictos (Postgres: 256 MB, Backend: 512 MB).
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: pictohabla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pictohabla}
      POSTGRES_USER: ${DB_USER:-pictohabla_app}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD es obligatoria}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Dataset ZFS en pool Datos (Permisos: UID 70:70, recordsize=16k)
      - /mnt/Datos/PictoHabla/Postgres:/var/lib/postgresql/data
    networks:
      # Exclusivamente en la red privada interna (sin acceso desde cloudflared ni host)
      - pictohabla-internal
    # PUERTO 5432 NO PUBLICADO EN EL HOST POR SEGURIDAD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pictohabla_app} -d $${POSTGRES_DB:-pictohabla}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    cpus: 1.00
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: pictohabla-backend:1.0.0
    container_name: pictohabla-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pictohabla}
      DB_USER: ${DB_USER:-pictohabla_app}
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD es obligatoria}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET es obligatoria}"
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://pictohabla.local}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.pictohabla.local}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      TRUSTED_PROXY_SUBNET: ${TRUSTED_PROXY_SUBNET:-172.16.1.0/24}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@pictohabla.local}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    volumes:
      # Dataset ZFS para subidas multimedia (Permisos: UID 1000:1000, usuario spring)
      - /mnt/Datos/PictoHabla/Uploads:/app/uploads
    # SIN PUERTOS MAPEADOS EN EL HOST: La comunicacion ocurre 100% de contenedor
    # a contenedor dentro de la red compartida ix-cloudflared_default
    networks:
      pictohabla-internal:
      ix-cloudflared_default:
        aliases:
          - pictohabla-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    mem_limit: 512m
    cpus: 1.50
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Red privada aislada de PictoHabla (Postgres <-> Backend)
  pictohabla-internal:
    driver: bridge
    internal: true

  # Red externa preexistente de la aplicacion Cloudflare Tunnel en TrueNAS SCALE
  ix-cloudflared_default:
    external: true
    name: ix-cloudflared_default
