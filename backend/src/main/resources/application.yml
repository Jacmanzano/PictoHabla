spring:
  application:
    name: pictohabla-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  security:
    cookie-secure: ${SECURITY_COOKIE_SECURE:false}
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:false}
    teacher-registration-enabled: ${TEACHER_REGISTRATION_ENABLED:true}
    max-failed-attempts: 5
    lockout-duration-minutes: 15
    trusted-proxy-ip: ${TRUSTED_PROXY_IP:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
