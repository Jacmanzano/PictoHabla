services:
  postgres:
    image: postgres:16-alpine
    container_name: pictohabla-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pictohabla}
      POSTGRES_USER: ${DB_USER:-pictohabla}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pictohabla_secret_change_in_prod}
    ports:
      # Expuesto únicamente en interfaz loopback local (nunca público)
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pictohabla_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pictohabla} -d ${DB_NAME:-pictohabla}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    networks:
      - pictohabla-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pictohabla-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pictohabla}
      DB_USER: ${DB_USER:-pictohabla}
      DB_PASSWORD: ${DB_PASSWORD:-pictohabla_secret_change_in_prod}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      SECURITY_COOKIE_SECURE: ${SECURITY_COOKIE_SECURE:-false}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    networks:
      - pictohabla-net

volumes:
  pictohabla_postgres_data:
    name: pictohabla_postgres_data

networks:
  pictohabla-net:
    name: pictohabla-net
    driver: bridge
